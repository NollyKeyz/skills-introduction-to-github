<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>XcelTutor - Upload Homework</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" href="/static/icons/xceltutor.svg">
    <meta name="theme-color" content="#0f172a">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>

<div class="app-container">
    <header class="app-header">
        <a href="/" class="back-btn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </a>
        <div class="header-titles">
            <h2 class="gradient-text">XcelTutor</h2>
            <p>Upload Homework</p>
        </div>
    </header>

    <main class="card glass-effect">
        <label class="upload-zone" id="dropZone" for="fileInput">
            <div class="upload-icon">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
            </div>
            <p>Click or drag file to this area to upload</p>
            <span class="file-info" id="fileInfo">Support for a single image or PDF</span>
        </label>
        <input type="file" id="fileInput" class="hidden-input" accept="image/*,application/pdf" onchange="handleFileSelect()">

        <div id="previewPanel" class="hidden fade-in">
            <div class="preview-container">
                <img id="imagePreview" alt="Uploaded homework preview">
            </div>
        </div>

        <div id="taskPanel" class="hidden fade-in">
            <h3>What do you want to do with it?</h3>
            
            <div class="input-group">
                <div class="select-wrapper">
                    <select id="taskSelect">
                        <option value="solve">Solve it step by step</option>
                        <option value="explain">Explain the question</option>
                        <option value="hint">Give me a hint</option>
                        <option value="check">Check my work</option>
                        <option value="extract">Extract the text only</option>
                        <option value="custom">Something else</option>
                    </select>
                </div>
            </div>

            <div class="input-group">
                <input type="text" id="customTask" class="hidden" placeholder="Tell XcelTutor what to do (e.g. Translate to Spanish)">
            </div>

            <button class="primary-btn full-width" onclick="processUploadedFile()" id="actionBtn">
                <span id="btnText">Ask Tutor</span>
                <span class="spinner hidden" id="loadingSpinner"></span>
            </button>
        </div>
    </main>

    <div id="resultContainer" class="hidden fade-in glass-effect result-card">
        <div class="result-header">
            <h3>Tutor Response</h3>
            <button class="copy-btn" onclick="copyResult()" title="Copy to clipboard">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
            </button>
        </div>
        <div id="result" class="result-content"></div>
    </div>
</div>

<script src="/static/script.js"></script>
<script src="/static/pwa.js"></script>
</body>
</html>
